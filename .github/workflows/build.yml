name: build
on:
  push:
    branches: [mistress]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        host: [ghost, noctis]
    steps:
      - uses: actions/checkout@v4
      - run: attic login local http://127.0.0.1:8080 ${{ secrets.ATTIC_TOKEN }}
      - run: nix build -L .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --out-link result-${{ matrix.host }}
      - run: attic push local:main result-${{ matrix.host }}
